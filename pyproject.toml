[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "edifier-qr65"
version = "0.1.0"
description = "Unofficial Edifier QR65 BLE lighting controller"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LightQv" }]
requires-python = ">=3.12"
dependencies = ["bleak>=3.0,<4"]
keywords = ["edifier", "qr65", "bluetooth", "ble", "lighting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Home Automation",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
calibration = ["numpy>=2,<3"]

[project.urls]
Homepage = "https://github.com/LightQv/edifier-qr65"
Repository = "https://github.com/LightQv/edifier-qr65"
Issues = "https://github.com/LightQv/edifier-qr65/issues"

[project.scripts]
edifier-qr65 = "edifier_qr65.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
