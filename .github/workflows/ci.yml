name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install '.[test,calibration]' 'build>=1,<2'
      - name: Test backend
        run: python -m pytest -q -p no:cacheprovider
      - name: Refit calibration profile
        run: python calibration/fit.py
      - name: Build Python distributions
        run: python -m build
      - name: Check shell scripts
        run: |
          bash -n install.sh uninstall.sh
          shellcheck install.sh uninstall.sh
      - name: Check systemd unit
        run: |
          install -d "$HOME/.config/edifier-qr65" "$HOME/.local/state/edifier-qr65"
          install -Dm755 /usr/bin/true "$HOME/.local/share/edifier-qr65/current/bin/edifier-qr65"
          systemd-analyze --user verify systemd/edifier-qr65.service
